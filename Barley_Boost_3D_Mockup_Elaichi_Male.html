<div id="wrap"><div id="stage"><div id="box">
<div class="f front"></div><div class="f back"></div><div class="f right"></div><div class="f left"></div><div class="f top"></div><div class="f bottom"></div>
</div></div></div>
<p>Drag to rotate · artwork unchanged</p>
<script>
var box=document.getElementById('box'),wrap=document.getElementById('wrap');
var rx=-12,ry=-28,drag=false,lx=0,ly=0,auto=true;
function s(){var k=Math.min(1,innerWidth/430,(innerHeight-120)/560);wrap.style.transform='scale('+k+')';wrap.style.transformOrigin='center'}
function r(){box.style.transform='rotateX('+rx+'deg) rotateY('+ry+'deg)'}
addEventListener('resize',s);s();r();
addEventListener('pointerdown',function(e){drag=true;auto=false;lx=e.clientX;ly=e.clientY});
addEventListener('pointerup',function(){drag=false});
addEventListener('pointermove',function(e){if(!drag)return;ry+=(e.clientX-lx)*.6;rx=Math.max(-80,Math.min(80,rx-(e.clientY-ly)*.5));lx=e.clientX;ly=e.clientY;r()});
(function t(){if(auto){ry+=.35;r()}requestAnimationFrame(t)})();
</script></body></html>
